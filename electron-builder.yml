appId: site.codingplan.openterminal
productName: OpenTerminal

directories:
  output: release

files:
  - out/**
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/@lydell/node-pty/**"
  - "**/node_modules/ssh2/**"

# @lydell/node-pty ships prebuilt binaries; do not trigger a rebuild.
npmRebuild: false

# NSIS exe is the only installer: electron-updater only supports NSIS
# auto-updates, so the MSI (no update channel) was dropped in v1.0.22.
win:
  target:
    - target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Installed shortcuts read "OTerminal"; productName stays OpenTerminal so the
  # userData dir and window title are untouched.
  shortcutName: OTerminal
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}

# Declaring a publish provider makes electron-builder emit the update-info file
# (latest.yml) into directories.output for upload. No token is stored here; the
# main agent handles feed authentication during upload. Build runs with the
# default publish policy, so nothing is uploaded from this script.
publish:
  provider: generic
  url: https://git.codingplan.site/api/packages/admin/generic/openterminal-update/stable/